name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# CI only ever reads the checkout.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: py${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # The floor (3.9) and the newest (3.14) from pyproject.toml's
      # requires-python range, plus one in the middle.
      #
      # macOS runners are arm64, where setup-python no longer offers 3.9, so
      # the two ends of the range are covered on Linux and macOS gets the
      # recent two.
      matrix:
        include:
          - { os: ubuntu-latest, python-version: "3.9" }
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: ubuntu-latest, python-version: "3.14" }
          - { os: macos-latest, python-version: "3.12" }
          - { os: macos-latest, python-version: "3.14" }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # There is no build step -- the scripts run from the checkout -- so
      # "does it build" means "does every file parse on this interpreter".
      - name: Byte-compile every script
        run: python -m compileall -q .

      - name: Every script must answer --help
        run: |
          for f in *.py; do
            echo "--- $f"
            python "$f" --help > /dev/null
          done

      - name: make help and make plan
        run: |
          make help
          make plan

      - name: Lint
        run: |
          python -m pip install --quiet ruff
          ruff check --output-format concise .

      # Cheap guard for the one mistake this repo must never make.
      - name: The repository must not ship books
        run: |
          if git ls-files '*.epub' | grep -q .; then
            echo "::error::EPUB files are tracked; never commit books."
            exit 1
          fi
          echo "no .epub tracked, as intended"
