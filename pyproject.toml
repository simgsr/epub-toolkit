# Metadata only.  This is a toolkit of scripts you run from a checkout, not an
# installable package, so there is deliberately no [build-system] and
# `pip install` is not supported -- the scripts locate the project through
# epub_paths.py's __file__ and are meant to run in place, next to your books.
#
# The reason this file exists at all is requires-python: it is the one piece of
# machine-readable metadata tooling (CI matrices, Dependabot, editors) needs.
# Dependabot reads it, and .github/workflows/ci.yml is expected to agree with it.

[project]
name = "epub-toolkit"
version = "1.0.0"
description = "Split multi-book EPUB bundles into one book per work, upgrade them to EPUB 3, and verify the results."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
keywords = ["epub", "epub3", "ebook", "split", "epubcheck", "calibre"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Text Processing :: Markup :: XML",
  "Topic :: Utilities",
]

# Keep this empty.  The toolkit has to run against a bare interpreter; a single
# entry here would quietly become a reason the pipeline stops working.
dependencies = []

# epubcheck is a Java tool, not a Python package, so it cannot be declared
# above.  It is optional: `make check-lite` skips it.
[project.optional-dependencies]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
# ruff's default rule set.  Kept explicit so a future ruff that widens its
# defaults cannot turn this repo's CI red without a deliberate decision.
select = ["E4", "E7", "E9", "F"]
